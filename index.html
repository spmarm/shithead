  background:radial-gradient(ellipse at 50% 30%, #2a3b5c 0%, var(--felt) 45%, var(--felt-deep) 100%);
  color:var(--cream);
  font-family:var(--font-body);
  font-size:15px;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;overflow-y:auto;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--rust-soft);outline-offset:2px}

/* ---------- Lobby ---------- */
#lobby{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:max(16px,env(safe-area-inset-left,0px));text-align:center;
  padding-top:max(16px,env(safe-area-inset-top,0px));
}
#lobby h1{
  font-family:var(--font-display);font-size:clamp(44px,12vw,72px);margin:0;line-height:1;
  font-variation-settings:"SOFT" 100;color:var(--cream);text-wrap:balance;
}
#lobby h1 small{display:block;font-family:var(--font-body);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:700}
.lobby-cat{
  width:96px;height:134px;border-radius:9px;background:var(--catback) center/cover;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transform:rotate(-6deg);border:3px solid var(--paper);
}
.field{display:flex;flex-direction:column;gap:6px;width:min(320px,100%)}
.field label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:left}
.field input{
  width:100%;padding:12px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.25);color:var(--cream);font-size:18px;font-weight:700;
}
.field input.code{letter-spacing:.35em;text-transform:uppercase;text-align:center;font-family:var(--font-display);font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(320px,100%)}
.btn{
  padding:12px 20px;border-radius:12px;border:0;font-weight:800;letter-spacing:.02em;
  background:var(--rust);color:#fff;box-shadow:0 4px 0 #7d2f1b;transition:transform .06s;
  flex:1;min-width:120px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d2f1b}
.btn.secondary{background:rgba(255,255,255,.1);box-shadow:0 4px 0 rgba(0,0,0,.35);color:var(--cream)}
.btn.secondary:active{box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.divider{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.hint{color:var(--muted);max-width:34ch;line-height:1.5;margin:0}
.roomcode{
  font-family:var(--font-display);font-size:64px;letter-spacing:.25em;line-height:1;
  color:var(--paper);text-shadow:0 4px 0 rgba(0,0,0,.35);margin-left:.25em;
}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- Table ---------- */
#table{height:100%;display:none;flex-direction:column;}
#table.on{display:flex}
#lobby.off{display:none}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:max(8px,env(safe-area-inset-top,0px)) 14px 6px;
  font-size:13px;color:var(--muted);font-weight:700;
}
.topbar .who{color:var(--cream);font-family:var(--font-display);font-size:16px;letter-spacing:.04em}
.conn{display:inline-flex;align-items:center;gap:6px}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.conn.bad::before{background:var(--red)}
.conn.bad{color:var(--rust-soft)}

.zone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 14px}
.zone.opp{padding-top:2px}
.zone-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;gap:10px;align-items:center}
.zone-label b{color:var(--cream);font-family:var(--font-display);font-size:15px;letter-spacing:.02em;text-transform:none}
.zone-label .turnpill{background:var(--rust);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.08em;font-size:10px}
.zone-label .readypill{background:var(--ok);color:var(--ink);padding:2px 8px;border-radius:999px;letter-spacing:.08em;font-size:10px}

.stack{display:flex;gap:8px;justify-content:center}
.slot{position:relative;width:var(--card-w);height:var(--card-h)}
.slot .card{position:absolute;left:0;top:0}
.slot .card.up{top:-10px}
.slot.empty{border:2px dashed rgba(255,255,255,.12);border-radius:8px}

.middle{flex:1;display:flex;align-items:center;justify-content:center;gap:34px;min-height:calc(var(--card-h) + 70px);position:relative;padding-top:30px}
.deck{position:relative;width:var(--card-w);height:var(--card-h)}
.deck .card{position:absolute;left:0;top:0}
.deck .count{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.pile{position:relative;width:var(--card-w);height:var(--card-h)}
.pile .card{position:absolute;left:0;top:0}
.pile .count{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.pile-hint{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:800;color:var(--cream);white-space:nowrap;letter-spacing:.03em;
}
.pile-hint.special{background:var(--rust);border-color:transparent}
.burn{position:absolute;right:14px;top:8px;font-size:11px;color:var(--muted);font-weight:800;text-align:right;line-height:1.4}

.message{
  text-align:center;min-height:22px;font-size:14px;font-weight:700;color:var(--cream);padding:0 14px;
}
.message.warn{color:var(--rust-soft)}

.hand-wrap{padding:6px 0 0;flex-shrink:0}
.actions{flex-shrink:0}
.zone.me{flex-shrink:0}
.hand{
  display:flex;justify-content:center;gap:0;padding:14px 14px 4px;overflow-x:auto;scrollbar-width:none;
  min-height:calc(var(--card-h) + 22px);
}
.hand::-webkit-scrollbar{display:none}
.hand .card{margin-left:calc(var(--card-w) * -0.32);flex:0 0 auto;transition:transform .12s}
.hand .card:first-child{margin-left:0}
.hand:not(.fan) .card.sel{transform:translateY(-14px)}
.hand.many .card{margin-left:calc(var(--card-w) * -0.5)}

.actions{
  display:flex;gap:10px;justify-content:center;padding:8px 14px max(12px,env(safe-area-inset-bottom,0px));
}
.actions .btn{flex:0 1 160px}

/* ---------- Cards ---------- */
.card{
  width:var(--card-w);height:var(--card-h);border-radius:7px;background:var(--paper);color:var(--ink);
  box-shadow:0 2px 6px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.25);position:relative;
  font-family:var(--font-display);user-select:none;-webkit-user-select:none;
}
.card.clickable{cursor:pointer}
.card.red{color:var(--red)}
.card .r{position:absolute;top:4px;left:6px;font-size:17px;font-weight:700;line-height:1}
.card .s{position:absolute;top:21px;left:6px;font-size:13px;line-height:1}
.card .big{position:absolute;right:6px;bottom:4px;font-size:30px;line-height:1}
.card .r2{position:absolute;bottom:4px;left:6px;font-size:11px;opacity:.55;font-family:var(--font-body);font-weight:800;letter-spacing:.04em}
.card.back{
  background:var(--catback) center/cover;border:3px solid var(--paper);
}
.card.playable{box-shadow:0 0 0 2px var(--rust-soft),0 2px 8px rgba(0,0,0,.4)}
.card.dim{opacity:.45}
.card.sel{box-shadow:0 0 0 3px var(--ok),0 6px 12px rgba(0,0,0,.4)}
.card.lastplay{box-shadow:0 0 0 2px var(--cream),0 6px 14px rgba(0,0,0,.5)}
.card.under{filter:brightness(.8)}
.pile .count b{color:var(--cream)}
.btn.fast{background:#2f7d4a;box-shadow:0 4px 0 #1d5230}
.card.special::after{
  content:attr(data-tag);position:absolute;top:4px;right:5px;font-family:var(--font-body);font-size:8px;
  font-weight:800;letter-spacing:.06em;color:var(--rust);text-transform:uppercase;
}
.opp .card{--card-w:48px;--card-h:67px;width:48px;height:67px}
.opp .slot{width:48px;height:67px}
.opp .card .r{font-size:14px;top:3px;left:5px}
.opp .card .s{font-size:11px;top:18px;left:5px}
.opp .card .big{font-size:22px}
.opp .card .r2{display:none}
.opp .card.back{border-width:2px}

.mini-hand{display:flex;justify-content:center}
.mini-hand .card{margin-left:-30px}
.mini-hand .card:first-child{margin-left:0}

/* ---------- Overlay ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(10,15,28,.82);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:20;
}
.overlay.on{display:flex}
.sheet{
  background:var(--felt-deep);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:26px 22px;
  max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;
}
.sheet h2{font-family:var(--font-display);font-size:34px;margin:0;line-height:1.05;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);line-height:1.5}
.sheet .cat{width:70px;height:98px;margin:0 auto;border-radius:7px;background:var(--catback) center/cover;border:3px solid var(--paper);transform:rotate(5deg)}

.log{font-size:12px;color:var(--muted);text-align:center;padding:0 14px;min-height:16px;font-weight:700}

/* recent plays strip */
.history{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:6px 14px 2px;min-height:58px;flex-shrink:0}
.history .h{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.75}
.history .h:last-child{opacity:1}
.history .h .cards{display:flex}
.history .h .card{--card-w:34px;--card-h:48px;width:34px;height:48px;border-radius:5px;margin-left:-14px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.history .h .card:first-child{margin-left:0}
.history .h .card .r{font-size:11px;top:2px;left:4px}
.history .h .card .s{font-size:9px;top:14px;left:4px}
.history .h .card .big{font-size:15px;right:3px;bottom:2px}
.history .h .card .r2,.history .h .card.special::after{display:none}
.history .h .who{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;white-space:nowrap}
.history .h .mark{font-size:26px;line-height:48px}
.history .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;align-self:center;margin-right:2px}

/* burn / pickup effects */
.fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.fx span{position:absolute;left:50%;top:45%;font-size:72px;line-height:1;transform:translate(-50%,-50%);opacity:0}
.fx.burn span{animation:flame 1.5s ease-out forwards}
.fx.burn span:nth-child(2){animation-delay:.12s;margin-left:-60px;font-size:54px}
.fx.burn span:nth-child(3){animation-delay:.22s;margin-left:62px;font-size:58px}
.fx.burn span:nth-child(4){animation-delay:.3s;margin-top:-10px;font-size:92px}
@keyframes flame{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(.8)}}
.fx.pickup span{animation:cry 1.8s ease-out forwards}
.fx.pickup span:nth-child(2),.fx.pickup span:nth-child(3){font-size:22px;animation:tear 1.8s ease-in forwards;animation-delay:.35s}
.fx.pickup span:nth-child(2){margin-left:-22px}.fx.pickup span:nth-child(3){margin-left:22px;animation-delay:.5s}
@keyframes cry{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}25%{transform:translate(-50%,-50%) scale(1) rotate(-8deg)}40%{transform:translate(-50%,-50%) rotate(8deg)}55%{transform:translate(-50%,-50%) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
@keyframes tear{0%{opacity:0;transform:translate(-50%,-20%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,180%)}}
@media (prefers-reduced-motion:reduce){.fx span{animation-duration:.01s!important}}

/* Bibi mode: pink sparkly nails */
body.bibi{--rust:#d63f95;--rust-soft:#ff7fc8;--skin:#d9a07a;--skin-dark:#b7795a;--nail:#ff5fb8;--nail-dark:#d6288f}
body.bibi .card.sel{box-shadow:0 0 0 3px #ff7fc8,0 0 18px rgba(255,127,200,.7)}
body.bibi .btn:not(.secondary){background:linear-gradient(135deg,#ff6fc0,#d63f95);box-shadow:0 4px 0 #8f1f61}
body.bibi .topbar .who::after{content:" ✨"}

/* fanned hand of cards */
.hand.fan{display:block;position:relative;height:calc(var(--card-h) + 64px);overflow:visible;padding:0}
.hand.fan .card{position:absolute;left:50%;bottom:26px;margin:0 0 0 calc(var(--card-w) / -2);transform-origin:50% 230%;transition:transform .15s}
.handart{position:absolute;left:50%;bottom:0;width:300px;max-width:100%;height:100%;transform:translateX(-50%);pointer-events:none;display:none}
.handart.back{z-index:0}
.handart.front{z-index:50}
body.bibi .hand.fan .handart{display:block}
body.bibi .hand.fan{height:calc(var(--card-h) + 84px)}
body.bibi .hand.fan .card{bottom:34px}
@media (prefers-reduced-motion:reduce){.handart animate{display:none}}
@media (min-height:900px){:root{--card-w:70px;--card-h:98px}}
@media (min-width:700px) and (min-height:700px){:root{--card-w:80px;--card-h:112px} body{font-size:16px}}
@media (max-height:720px){:root{--card-w:52px;--card-h:73px} .opp .mini-hand{display:none} .zone{gap:4px} .middle{padding-top:26px;min-height:calc(var(--card-h) + 58px)} .history{min-height:52px;padding-top:2px} .hand-wrap{padding-top:0} .actions{padding-top:4px}}
@media (max-height:720px){body.bibi .hand.fan{height:calc(var(--card-h) + 70px)} body.bibi .hand.fan .card{bottom:30px} .history{min-height:48px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
/* ============================================================
   RULES ENGINE  (pure, no DOM)
   ============================================================ */
const SUITS = ['S','H','D','C'];
const SUIT_SYM = {S:'♠',H:'♥',D:'♦',C:'♣'};
const RANK_NAME = {11:'J',12:'Q',13:'K',14:'A'};
const rankLabel = r => RANK_NAME[r] || String(r);
const cardName = c => rankLabel(c.r)+SUIT_SYM[c.s];
const listCards = cs => cs.map(cardName).join(' ');
const isSpecial = r => r===2||r===3||r===7||r===10;

function makeDeck(){
  const d=[]; let id=0;
  for(const s of SUITS) for(let r=2;r<=14;r++) d.push({id:id++, r, s});
  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function newGame(names){
  const deck=makeDeck();
  const players=names.map(n=>({name:n, hand:[], up:[], down:[], ready:false}));
  for(const p of players){ p.down=deck.splice(0,3); p.up=deck.splice(0,3); p.hand=deck.splice(0,3); }
  return {phase:'swap', players, deck, pile:[], burned:0, turn:0, winner:null, log:'Swap cards, then tap Ready.', lastBlind:null, lastPlay:null, history:[], event:null, eventSeq:0};
}

function effectiveTop(pile){
  for(let i=pile.length-1;i>=0;i--) if(pile[i].r!==3) return pile[i];
  return null;
}

function canPlayRank(r, pile){
  if(r===2||r===3||r===10) return true;
  const t=effectiveTop(pile);
  if(!t) return true;
  if(t.r===2) return true;
  if(t.r===7) return r<=7;
  return r>=t.r;
}

/* Which cards may this player choose from right now? */
function source(p){
  if(p.hand.length) return 'hand';
  if(p.up.length) return 'up';
  if(p.down.length) return 'down';
  return null;
}

function hasLegalMove(p, pile){
  const src=source(p);
  if(src==='down') return true;          // can always attempt a blind flip
  if(!src) return false;
  return p[src].some(c=>canPlayRank(c.r, pile));
}

function cardsLeft(p){ return p.hand.length+p.up.length+p.down.length; }
function pushHistory(state, entry){ state.history=(state.history||[]).concat([entry]).slice(-3); }
function fireEvent(state, type, by){ state.eventSeq=(state.eventSeq||0)+1; state.event={id:state.eventSeq, type, by}; }

/* Cards this player may add to their own last play while the other player hasn't moved. */
function fastCards(state, pi){
  const lp=state.lastPlay, p=state.players[pi];
  if(state.phase!=='play'||!lp||lp.by!==pi||state.turn===pi) return [];
  const src=source(p); if(src!=='hand'&&src!=='up') return [];
  return p[src].filter(c=>c.r===lp.rank);
}

function pileHint(pile){
  const t=effectiveTop(pile);
  if(!t) return {text:'Anything goes', special:true};
  if(t.r===2) return {text:'Anything goes', special:true};
  if(t.r===7) return {text:'Play 7 or lower', special:true};
  return {text:`Play ${rankLabel(t.r)} or higher`, special:false};
}

/* Lowest non-special card decides who starts. */
function starter(players){
  const val=p=>{
    const vals=p.hand.map(c=>isSpecial(c.r)?c.r+100:c.r);
    return Math.min(...vals);
  };
  const v=players.map(val);
  let best=0; for(let i=1;i<v.length;i++) if(v[i]<v[best]) best=i;
  return best;
}

function drawUp(state, p){
  while(p.hand.length<3 && state.deck.length) p.hand.push(state.deck.shift());
}

/* After cards land on the pile: burn / go-again / next turn / win. Returns nothing, mutates. */
function afterPlay(state, pi, playedRank){
  const p=state.players[pi];
  drawUp(state, p);
  if(cardsLeft(p)===0){ state.phase='over'; state.winner=pi; state.log=`${p.name} is out of cards.`; return; }
  const n=state.pile.length;
  const fourKind = n>=4 && state.pile.slice(-4).every(c=>c.r===state.pile[n-1].r);
  if(playedRank===10 || fourKind){
    state.burned+=state.pile.length; state.pile=[]; state.lastPlay=null;
    pushHistory(state,{by:pi, burn:true}); fireEvent(state,'burn',pi);
    state.log=`${p.name} burned the pile${fourKind&&playedRank!==10?' with four of a kind':''}. Go again!`;
    return; // same player
  }
  if(playedRank===2){ state.log=`${p.name} played a 2. Go again!`; return; }
  state.turn=(pi+1)%state.players.length;
}

/* Apply an action from player pi. Returns {ok, error?}. Mutates state on success. */
function applyAction(state, pi, a){
  const p=state.players[pi];
  const me=p.name;
  if(a.type==='rematch'){
    if(state.phase!=='over') return {ok:false,error:'Game is still going.'};
    const fresh=newGame(state.players.map(x=>x.name));
    Object.assign(state, fresh);
    return {ok:true};
  }
  if(state.phase==='swap'){
    if(a.type==='swap'){
      if(p.ready) return {ok:false,error:'You are already ready.'};
      const hi=p.hand.findIndex(c=>c.id===a.handId), ui=p.up.findIndex(c=>c.id===a.upId);
      if(hi<0||ui<0) return {ok:false,error:'Pick one hand card and one face-up card.'};
      [p.hand[hi],p.up[ui]]=[p.up[ui],p.hand[hi]];
      return {ok:true};
    }
    if(a.type==='ready'){
      p.ready=true;
      if(state.players.every(x=>x.ready)){
        state.phase='play'; state.turn=starter(state.players);
        state.log=`${state.players[state.turn].name} has the lowest card and starts.`;
      } else state.log=`${me} is ready.`;
      return {ok:true};
    }
    return {ok:false,error:'Still swapping.'};
  }
  if(state.phase!=='play') return {ok:false,error:'Game over.'};
  if(a.type==='fast'){
    const lp=state.lastPlay;
    if(!lp||lp.by!==pi||state.turn===pi) return {ok:false,error:'Too late, or nothing to add to.'};
    const src=source(p);
    if(src!=='hand'&&src!=='up') return {ok:false,error:'Nothing to add.'};
    const ids=[...new Set(a.ids||[])];
    const cards=ids.map(id=>p[src].find(c=>c.id===id));
    if(!cards.length||cards.some(c=>!c||c.r!==lp.rank)) return {ok:false,error:`Only ${rankLabel(lp.rank)}s can be added now.`};
    p[src]=p[src].filter(c=>!ids.includes(c.id));
    state.pile.push(...cards);
    lp.cards.push(...cards);
    { const h=state.history||[]; const last=h[h.length-1]; if(last&&last.by===pi&&last.cards) last.cards=last.cards.concat(cards); else pushHistory(state,{by:pi,cards:cards.slice()}); }
    state.log=`${me} quickly added ${listCards(cards)}.`;
    const opp=state.turn;
    state.turn=pi;            // afterPlay reasons from the player who played
    afterPlay(state, pi, lp.rank);
    if(state.phase==='play' && state.pile.length) state.turn=opp;  // no burn: still their turn
    return {ok:true};
  }
  if(state.turn!==pi) return {ok:false,error:'Not your turn.'};
  state.lastBlind=null;

  if(a.type==='play'){
    const src=source(p);
    if(src!=='hand'&&src!=='up') return {ok:false,error:'Flip a blind card instead.'};
    const ids=[...new Set(a.ids||[])];
    if(!ids.length) return {ok:false,error:'Pick some cards.'};
    const cards=ids.map(id=>p[src].find(c=>c.id===id));
    if(cards.some(c=>!c)) return {ok:false,error:'Those cards are not yours to play.'};
    const r=cards[0].r;
    if(cards.some(c=>c.r!==r)) return {ok:false,error:'All cards must be the same rank.'};
    if(!canPlayRank(r, state.pile)) return {ok:false,error:`You can't play a ${rankLabel(r)} there.`};
    p[src]=p[src].filter(c=>!ids.includes(c.id));
    state.pile.push(...cards);
    state.lastPlay={by:pi, rank:r, cards:cards.slice()};
    pushHistory(state,{by:pi, cards:cards.slice()});
    state.log=`${me} played ${listCards(cards)}.`;
    afterPlay(state, pi, r);
    return {ok:true};
  }
  if(a.type==='blind'){
    if(source(p)!=='down') return {ok:false,error:'You still have cards to play first.'};
    const idx=a.index|0;
    if(idx<0||idx>=p.down.length) return {ok:false,error:'Pick a blind card.'};
    const [c]=p.down.splice(idx,1);
    state.lastBlind={card:c, ok:canPlayRank(c.r, state.pile), by:pi};
    if(state.lastBlind.ok){
      state.pile.push(c);
      state.lastPlay={by:pi, rank:c.r, cards:[c]};
      pushHistory(state,{by:pi, cards:[c], blind:true});
      state.log=`${me} flipped ${cardName(c)}. It plays!`;
      afterPlay(state, pi, c.r);
    } else {
      p.hand.push(...state.pile, c); state.pile=[]; state.lastPlay=null;
      pushHistory(state,{by:pi, pickup:true}); fireEvent(state,'pickup',pi);
      state.log=`${me} flipped ${cardName(c)}. No good. Picked up the pile.`;
      state.turn=(pi+1)%state.players.length;
    }
    return {ok:true};
  }
  if(a.type==='pickup'){
    if(!state.pile.length) return {ok:false,error:'Nothing to pick up.'};
    if(hasLegalMove(p, state.pile)) return {ok:false,error:'You have a legal move. Play it.'};
    p.hand.push(...state.pile); state.pile=[]; state.lastPlay=null;
    pushHistory(state,{by:pi, pickup:true}); fireEvent(state,'pickup',pi);
    state.log=`${me} couldn't play and picked up the pile.`;
    state.turn=(pi+1)%state.players.length;
    return {ok:true};
  }
  return {ok:false,error:'Unknown move.'};
}

/* What player pi is allowed to see. */
function viewFor(state, pi){
  return {
    phase:state.phase, turn:state.turn, winner:state.winner, log:state.log, burned:state.burned,
    deck:state.deck.length, pile:state.pile, lastBlind:state.lastBlind, lastPlay:state.lastPlay, history:state.history||[], event:state.event||null, me:pi,
    players:state.players.map((p,i)=>({
      name:p.name, ready:p.ready, up:p.up, down:p.down.length,
      hand: i===pi ? p.hand : p.hand.length,
    })),
  };
}

/* ============================================================
   NETWORK  (PeerJS)
   ============================================================ */
const PREFIX='rugcat-shithead-';
const LS_HOST='shithead.host', LS_JOIN='shithead.join';
let role=null;           // 'host' | 'join'
let peer=null, conn=null;
let roomCode='';
let myName='';
let state=null;          // host only: full state
let view=null;           // what I render
let joinerName='';       // host only
let reconnectTimer=null;

const $=id=>document.getElementById(id);
const store={ get(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} } };

function randomCode(){ const L='ABCDEFGHJKMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }

function setConn(ok, text){ const el=$('t-conn'); el.classList.toggle('bad',!ok); el.textContent=text; }

function makePeer(id){
  const p = id ? new Peer(id,{debug:0}) : new Peer({debug:0});
  p.on('error', e=>{
    if(e.type==='unavailable-id'){ lobbyHint('That room code is taken. Try hosting again.'); resetToLobby(); }
    else if(e.type==='peer-unavailable'){ lobbyHint('No game with that code. Check it and try again.'); if(role==='join'&&!view) resetToLobby(); }
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){ setConn(false,'reconnecting…'); scheduleReconnect(); }
    else console.warn('peer error', e);
  });
  p.on('disconnected', ()=>{ setConn(false,'reconnecting…'); scheduleReconnect(); });
  return p;
}

function scheduleReconnect(){
  if(reconnectTimer) return;
  reconnectTimer=setTimeout(()=>{
    reconnectTimer=null;
    if(!peer) return;
    if(peer.destroyed){ return; }
    if(peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
    if(role==='join' && (!conn||!conn.open) && !peer.disconnected) joinConnect();
    if((role==='join'&&(!conn||!conn.open)) || peer.disconnected) scheduleReconnect();
  }, 2500);
}

/* ---- Host ---- */
function hostGame(resume){
  role='host';
  if(resume){ const s=store.get(LS_HOST); roomCode=s.code; state=s.state; myName=s.names[0]; joinerName=s.names[1]; }
  else { roomCode=randomCode(); state=null; }
  $('lobby-main').hidden=true; $('lobby-wait').hidden=false; $('roomcode').textContent=roomCode;
  $('wait-text').textContent = resume ? `Waiting for ${joinerName} to rejoin…` : 'Waiting for your partner to join…';
  peer=makePeer(PREFIX+roomCode);
  peer.on('open', ()=>{ if(state) saveHost(); });
  peer.on('connection', c=>{
    c.on('open', ()=>{});
    c.on('data', d=>{
      if(d.type==='hello'){
        if(conn && conn.open && conn!==c){ c.send({type:'full'}); setTimeout(()=>c.close(),300); return; }
        if(conn && conn!==c){ try{conn.close();}catch(e){} }
        conn=c;
        if(!state){ joinerName=d.name||'Partner'; state=newGame([myName, joinerName]); }
        else if(d.name) { joinerName=d.name; state.players[1].name=d.name; }
        setConn(true,'connected'); showTable(); broadcast();
      } else if(d.type==='action'){
        if(c!==conn) return;
        const res=applyAction(state,1,d.action);
        if(!res.ok) c.send({type:'error',msg:res.error}); else broadcast();
      }
    });
    c.on('close', ()=>{ if(c===conn){ setConn(false, `${joinerName} dropped. waiting…`); } });
  });
}
function saveHost(){ store.set(LS_HOST,{code:roomCode,state,names:[myName,joinerName]}); }
function broadcast(){
  saveHost();
  view=viewFor(state,0); selected=[]; render();
  if(conn&&conn.open) conn.send({type:'state', view:viewFor(state,1)});
}
function hostAct(action){
  const res=applyAction(state,0,action);
  if(!res.ok) flash(res.error,true); else broadcast();
}

/* ---- Joiner ---- */
function joinGame(code){
  role='join'; roomCode=code;
  $('lobby-main').hidden=true; $('lobby-wait').hidden=false; $('roomcode').textContent=roomCode;
  $('wait-text').textContent='Connecting…';
  store.set(LS_JOIN,{code,name:myName});
  peer=makePeer();
  peer.on('open', joinConnect);
}
function joinConnect(){
  if(!peer||peer.destroyed) return;
  if(conn && conn.open) return;
  const c=peer.connect(PREFIX+roomCode,{reliable:true});
  c.on('open', ()=>{ conn=c; c.send({type:'hello',name:myName}); setConn(true,'connected'); });
  c.on('data', d=>{
    if(d.type==='state'){ view=d.view; selected=[]; showTable(); render(); }
    else if(d.type==='error'){ flash(d.msg,true); }
    else if(d.type==='full'){ lobbyHint('That game already has two players.'); resetToLobby(); }
  });
  c.on('close', ()=>{ if(conn===c){ conn=null; setConn(false,'reconnecting…'); scheduleReconnect(); } });
  c.on('error', ()=>{ scheduleReconnect(); });
}
function sendAct(action){
  if(role==='host') return hostAct(action);
  if(conn&&conn.open) conn.send({type:'action',action}); else flash('Not connected right now.',true);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && peer){
    if(peer.disconnected) { try{peer.reconnect();}catch(e){} }
    if(role==='join' && (!conn||!conn.open)) scheduleReconnect();
  }
});

/* ============================================================
   UI
   ============================================================ */
let selected=[];      // ids of selected cards (hand or up)
let swapPick=null;    // during swap: {src:'hand'|'up', id}
let flashTimer=null;

function lobbyHint(t){ $('lobby-hint').textContent=t; }
function flash(msg, warn){
  const m=$('message'); m.textContent=msg; m.classList.toggle('warn',!!warn);
  clearTimeout(flashTimer); flashTimer=setTimeout(render, 2200);
}
function showTable(){ $('lobby').classList.add('off'); $('table').classList.add('on'); $('t-room').textContent='Room '+roomCode; applyBibi(); }
function resetToLobby(){
  try{ peer&&peer.destroy(); }catch(e){}
  peer=null; conn=null; view=null; state=null; role=null;
  $('lobby').classList.remove('off'); $('table').classList.remove('on');
  $('lobby-main').hidden=false; $('lobby-wait').hidden=true; $('overlay').classList.remove('on');
  updateResume();
}
function updateResume(){
  const h=store.get(LS_HOST), j=store.get(LS_JOIN);
  const row=$('resume-row'), b=$('btn-resume');
  if(h && h.state && h.state.phase!=='over'){ row.hidden=false; b.textContent=`Resume hosting ${h.code}`; b.onclick=()=>{ hostGame(true); }; }
  else if(j && j.code){ row.hidden=false; b.textContent=`Rejoin ${j.code} as ${j.name}`; b.onclick=()=>{ myName=j.name; joinGame(j.code); }; }
  else row.hidden=true;
}

function cardEl(c, opts={}){
  const el=document.createElement('div');
  if(!c){ el.className='card back'; el.setAttribute('aria-label','face-down card'); return el; }
  const red=c.s==='H'||c.s==='D';
  el.className='card'+(red?' red':'')+(isSpecial(c.r)?' special':'');
  if(isSpecial(c.r)) el.dataset.tag = c.r===2?'any':c.r===3?'ghost':c.r===7?'low':'burn';
  el.setAttribute('aria-label',`${rankLabel(c.r)} of ${({S:'spades',H:'hearts',D:'diamonds',C:'clubs'})[c.s]}`);
  el.innerHTML=`<span class="r">${rankLabel(c.r)}</span><span class="s">${SUIT_SYM[c.s]}</span><span class="big">${SUIT_SYM[c.s]}</span>`;
  if(opts.clickable){ el.classList.add('clickable'); el.tabIndex=0; el.setAttribute('role','button'); }
  return el;
}

function render(){
  if(!view) return;
  const v=view, me=v.players[v.me], opp=v.players[1-v.me];
  const myTurn=v.phase==='play'&&v.turn===v.me;
  const fastIds = (v.phase==='play'&&v.lastPlay&&v.lastPlay.by===v.me&&!myTurn) ? (me.hand.length?me.hand:me.up).filter(c=>c.r===v.lastPlay.rank).map(c=>c.id) : [];

  // Opponent
  $('opp-label').innerHTML=`<b>${esc(opp.name)}</b> <span>${opp.hand} in hand</span>`+
    (v.phase==='play'&&v.turn!==v.me?' <span class="turnpill">their turn</span>':'')+
    (v.phase==='swap'&&opp.ready?' <span class="readypill">ready</span>':'');
  const os=$('opp-stack'); os.innerHTML='';
  for(let i=0;i<3;i++){
    const slot=document.createElement('div'); slot.className='slot';
    if(i<opp.down) slot.appendChild(cardEl(null));
    if(opp.up[i]){ const e=cardEl(opp.up[i]); e.classList.add('up'); slot.appendChild(e); }
    if(i>=opp.down && !opp.up[i]) slot.classList.add('empty');
    os.appendChild(slot);
  }
  const oh=$('opp-hand'); oh.innerHTML='';
  for(let i=0;i<Math.min(opp.hand,8);i++) oh.appendChild(cardEl(null));

  // Middle
  const deck=$('deck'); deck.innerHTML='';
  if(v.deck){ const e=cardEl(null); deck.appendChild(e); const c=document.createElement('span'); c.className='count'; c.textContent=`${v.deck} to draw`; deck.appendChild(c); }
  else { deck.innerHTML='<div class="slot empty" style="position:absolute;inset:0"></div><span class="count">deck empty</span>'; }
  const pile=$('pile'); pile.innerHTML='';
  const lp=v.lastPlay, n=lp?lp.cards.length:0;
  pile.style.width=`calc(var(--card-w) * ${1+0.5*Math.max(0,n-1)})`;
  if(!v.pile.length) pile.innerHTML='<div class="slot empty" style="position:absolute;inset:0"></div>';
  const under=v.pile.slice(0, v.pile.length-n).slice(-2);
  under.forEach((c,i)=>{ const e=cardEl(c); e.classList.add('under'); e.style.transform=`rotate(${(i-under.length)*6}deg) translate(${(i-under.length)*3}px,0)`; pile.appendChild(e); });
  if(lp) lp.cards.forEach((c,i)=>{ const e=cardEl(c); e.classList.add('lastplay'); e.style.transform=`translate(calc(var(--card-w) * ${0.5*i}), -4px) rotate(${(i-(n-1)/2)*3}deg)`; e.style.zIndex=10+i; pile.appendChild(e); });
  const pc=document.createElement('span'); pc.className='count';
  pc.innerHTML = lp ? `<b>${lp.by===v.me?'you':esc(v.players[lp.by].name)} played${n>1?' ×'+n:''}</b>` : (v.pile.length?`${v.pile.length} in pile`:'empty pile');
  pile.appendChild(pc);
  const hint=pileHint(v.pile); const ph=$('pile-hint');
  if(v.phase==='play'){ ph.textContent=hint.text; ph.classList.toggle('special',hint.special); ph.style.display=''; } else ph.style.display='none';
  $('burn').textContent=[v.pile.length?`${v.pile.length} in pile`:'', v.burned?`${v.burned} burned`:''].filter(Boolean).join(' · ');

  // Message / log
  const msg=$('message'); msg.classList.remove('warn');
  if(v.phase==='swap') msg.textContent = me.ready ? `Waiting for ${opp.name}…` : 'Tap a hand card and a face-up card to swap them.';
  else if(v.phase==='play'){
    if(myTurn){
      const src = me.hand.length?'hand':me.up.length?'up':'down';
      msg.textContent = src==='hand'?'Your turn. Pick cards and play.' : src==='up'?'Your turn. Play from your face-up cards.' : 'Your turn. Tap a blind card and pray.';
    } else if(fastIds.length) msg.textContent=`Quick! You have another ${rankLabel(v.lastPlay.rank)}. Add it before ${opp.name} plays.`;
    else msg.textContent=`${opp.name} is thinking…`;
  } else msg.textContent='';
  $('log').textContent=v.log||'';

  // Recent plays
  const hist=$('history'); hist.innerHTML='';
  if(v.phase==='play' && v.history.length){
    const l=document.createElement('span'); l.className='lbl'; l.textContent='Recent'; hist.appendChild(l);
    for(const h of v.history){
      const d=document.createElement('div'); d.className='h';
      if(h.cards){ const cs=document.createElement('div'); cs.className='cards'; h.cards.forEach(c=>cs.appendChild(cardEl(c))); d.appendChild(cs); }
      else { const m=document.createElement('div'); m.className='mark'; m.textContent=h.burn?'🔥':'😭'; d.appendChild(m); }
      const w=document.createElement('span'); w.className='who'; w.textContent=(h.by===v.me?'you':v.players[h.by].name)+(h.burn?' burned':h.pickup?' picked up':h.blind?' (blind)':''); d.appendChild(w);
      hist.appendChild(d);
    }
  }
  playEvent(v.event);

  // Me
  $('me-label').innerHTML=`<b>${esc(me.name)}</b>`+(myTurn?' <span class="turnpill">your turn</span>':'')+(v.phase==='swap'&&me.ready?' <span class="readypill">ready</span>':'');
  const ms=$('me-stack'); ms.innerHTML='';
  const upPlayable = v.phase==='play'&&myTurn&&!me.hand.length;
  const downPlayable = upPlayable&&!me.up.length;
  for(let i=0;i<3;i++){
    const slot=document.createElement('div'); slot.className='slot';
    if(i<me.down){
      const e=cardEl(null); slot.appendChild(e);
      if(downPlayable){ e.classList.add('clickable','playable'); e.tabIndex=0; e.onclick=()=>sendAct({type:'blind',index:i}); e.onkeydown=k=>{ if(k.key==='Enter'||k.key===' ') e.onclick(); }; }
    }
    if(me.up[i]){
      const c=me.up[i]; const e=cardEl(c,{clickable:v.phase==='swap'&&!me.ready||upPlayable||fastIds.includes(c.id)}); e.classList.add('up');
      if(v.phase==='swap'&&!me.ready){ if(swapPick&&swapPick.src==='up'&&swapPick.id===c.id) e.classList.add('sel'); e.onclick=()=>pickSwap('up',c.id); }
      else if(upPlayable){
        const ok=canPlayRank(c.r,v.pile); e.classList.toggle('playable',ok); e.classList.toggle('dim',!ok);
        if(selected.includes(c.id)) e.classList.add('sel');
        e.onclick=()=>toggleSelect(c, me.up);
      } else if(fastIds.length && !me.hand.length){
        const ok=fastIds.includes(c.id); e.classList.toggle('playable',ok); e.classList.toggle('dim',!ok);
        if(selected.includes(c.id)) e.classList.add('sel');
        if(ok) e.onclick=()=>toggleSelect(c, me.up);
      }
      e.onkeydown=k=>{ if((k.key==='Enter'||k.key===' ')&&e.onclick){ k.preventDefault(); e.onclick(); } };
      slot.appendChild(e);
    }
    if(i>=me.down && !me.up[i]) slot.classList.add('empty');
    ms.appendChild(slot);
  }
  const hand=$('hand'); hand.querySelectorAll('.card').forEach(e=>e.remove());
  const nH=me.hand.length, fan=nH<=12;
  hand.classList.toggle('fan',fan); hand.classList.toggle('many', !fan&&nH>9);
  const spread = nH>1 ? Math.min(7, 52/(nH-1)) : 0;
  const frontArt=hand.querySelector('.handart.front');
  const sorted=[...me.hand].sort((a,b)=>a.r-b.r||a.s.localeCompare(b.s));
  sorted.forEach((c,idx)=>{
    const e=cardEl(c,{clickable:v.phase==='swap'&&!me.ready||(myTurn&&me.hand.length>0)||fastIds.includes(c.id)});
    if(v.phase==='swap'&&!me.ready){ if(swapPick&&swapPick.src==='hand'&&swapPick.id===c.id) e.classList.add('sel'); e.onclick=()=>pickSwap('hand',c.id); }
    else if(myTurn){
      const ok=canPlayRank(c.r,v.pile); e.classList.toggle('playable',ok); e.classList.toggle('dim',!ok);
      if(selected.includes(c.id)) e.classList.add('sel');
      e.onclick=()=>toggleSelect(c, me.hand);
    } else if(fastIds.length){
      const ok=fastIds.includes(c.id); e.classList.toggle('playable',ok); e.classList.toggle('dim',!ok);
      if(selected.includes(c.id)) e.classList.add('sel');
      if(ok) e.onclick=()=>toggleSelect(c, me.hand);
    }
    e.onkeydown=k=>{ if((k.key==='Enter'||k.key===' ')&&e.onclick){ k.preventDefault(); e.onclick(); } };
    if(fan){ const a=(idx-(nH-1)/2)*spread; e.style.transform=`rotate(${a}deg)${selected.includes(c.id)?' translateY(-16px)':''}`; e.style.zIndex=idx+1; }
    else { e.style.transform=''; e.style.zIndex=''; }
    if(fan) hand.insertBefore(e, frontArt); else hand.appendChild(e);
  });

  // Actions
  const act=$('actions'); act.innerHTML='';
  if(v.phase==='swap'){
    if(!me.ready){ const b=btn('Ready',()=>{ swapPick=null; sendAct({type:'ready'}); }); act.appendChild(b); }
  } else if(v.phase==='play' && myTurn){
    const src = me.hand.length?me.hand:me.up;
    const canPlaySel = selected.length>0;
    const b=btn(selected.length>1?`Play ${selected.length} cards`:'Play',()=>{ sendAct({type:'play',ids:selected}); }); b.disabled=!canPlaySel; act.appendChild(b);
    const anyLegal = me.hand.length||me.up.length ? src.some(c=>canPlayRank(c.r,v.pile)) : true;
    const pu=btn('Pick up pile',()=>sendAct({type:'pickup'})); pu.className='btn secondary'; pu.disabled=anyLegal||!v.pile.length; act.appendChild(pu);
  } else if(v.phase==='play' && fastIds.length){
    const r=rankLabel(v.lastPlay.rank);
    const b=btn(selected.length>1?`Add ${selected.length} ${r}s fast`:`Add ${r} fast`,()=>{ sendAct({type:'fast',ids:selected}); });
    b.classList.add('fast'); b.disabled=!selected.length; act.appendChild(b);
  }

  // Game over
  const ov=$('overlay');
  if(v.phase==='over'){
    const won=v.winner===v.me;
    $('ov-title').textContent = won ? 'You win!' : 'You are the Shithead.';
    $('ov-text').textContent = won ? `${opp.name} is the Shithead. Be gracious. Or don't.` : `${opp.name} got rid of everything first. Demand a rematch.`;
    ov.classList.add('on');
  } else ov.classList.remove('on');
}

let seenEvent;
function playEvent(ev){
  if(seenEvent===undefined){ seenEvent=ev?ev.id:0; return; }   // no replay on first render / resume
  if(!ev||ev.id===seenEvent) return;
  seenEvent=ev.id;
  const fx=$('fx'); fx.className='fx '+ev.type;
  fx.innerHTML = ev.type==='burn' ? '<span>🔥</span><span>🔥</span><span>🔥</span><span>🔥</span>' : '<span>😭</span><span>💧</span><span>💧</span>';
  clearTimeout(fx._t); fx._t=setTimeout(()=>{ fx.className='fx'; fx.innerHTML=''; }, 2000);
}
function applyBibi(){
  const on=/^bibi$/i.test((myName||'').trim());
  document.body.classList.toggle('bibi',on);
}
function btn(label, fn){ const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.onclick=fn; return b; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function toggleSelect(c, pool){
  if(selected.includes(c.id)) selected=selected.filter(x=>x!==c.id);
  else {
    const firstSel=pool.find(x=>x.id===selected[0]);
    if(firstSel && firstSel.r!==c.r) selected=[c.id];     // switching rank
    else selected=[...selected,c.id];
  }
  render();
}
function pickSwap(src,id){
  if(swapPick && swapPick.src!==src){
    const handId = src==='hand'?id:swapPick.id, upId = src==='up'?id:swapPick.id;
    swapPick=null; sendAct({type:'swap',handId,upId}); return;
  }
  swapPick = (swapPick&&swapPick.id===id)?null:{src,id};
  render();
}

/* ---- Lobby wiring ---- */
$('btn-host').onclick=()=>{
  myName=($('name').value||'').trim(); if(!myName){ lobbyHint('Type your name first.'); $('name').focus(); return; }
  store.set('shithead.name',myName); store.del(LS_HOST); store.del(LS_JOIN); hostGame(false);
};
$('btn-join').onclick=()=>{
  myName=($('name').value||'').trim(); if(!myName){ lobbyHint('Type your name first.'); $('name').focus(); return; }
  const code=($('code').value||'').trim().toUpperCase(); if(code.length!==4){ lobbyHint('Room codes are 4 letters.'); $('code').focus(); return; }
  store.set('shithead.name',myName); store.del(LS_HOST); joinGame(code);
};
$('code').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,''); });
$('code').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn-join').click(); });
$('name').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn-host').click(); });
$('btn-cancel').onclick=()=>{ store.del(LS_HOST); store.del(LS_JOIN); resetToLobby(); };
$('btn-copy').onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(roomCode).then(()=>{ $('btn-copy').textContent='Copied'; setTimeout(()=>$('btn-copy').textContent='Copy code',1500); }).catch(()=>{}); };
$('btn-rematch').onclick=()=>sendAct({type:'rematch'});

(function init(){
  const n=store.get('shithead.name'); if(n) $('name').value=n;
  updateResume();
})();
</script>
